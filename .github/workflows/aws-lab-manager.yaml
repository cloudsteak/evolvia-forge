################################################
# AWS Lab Manager - Terraform Workflow fow Amazon Web Services (AWS)
# This workflow is used to manage AWS labs using Terraform
# It is designed to be triggered manually via the GitHub Actions API
# It supports the following actions: apply, destroy
# It requires the following secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# It requires the following environment variables: AWS_REGION, TF_STATE_BUCKET
################################################

name: AWS Lab Manager

env:
  TERRAFORM_VERSION: 1.11.0

on:
  workflow_dispatch: # Allows manual trigger via API
    inputs:
      lab:
        description: "Lab name"
        type: choice
        options:
          - "basic"
          - "s3-staticwebsite"
          - "ec2-webserver"
          - "rds-mysql"
        required: true
        default: "basic"
      action:
        description: "Terraform action"
        type: choice
        options:
          - "apply"
          - "destroy"
        required: true
        default: "apply"
      student_username:
        description: "Unique student username"
        required: true
      student_password:
        description: "Unique student password"
        required: true

jobs:
  terraform:
    name: ${{ github.event.inputs.action }} - aws - ${{ github.event.inputs.student_username }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.status.outputs.status }}

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS CLI
        id: verify-cli
        run: aws s3 ls

      - name: Install boto3
        run: pip3 install boto3

      - name: Set up Terraform
        id: setup
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        working-directory: ${{ github.workspace }}/aws/labs/${{ github.event.inputs.lab }}
        run: |
          terraform init -reconfigure \
            -backend-config=bucket=${{ vars.TF_STATE_BUCKET }} \
            -backend-config=key=labs/${{ github.event.inputs.student_username }}/terraform.tfstate \
            -backend-config=region=${{ vars.AWS_REGION }} \
            -backend-config=encrypt=true \
            -backend-config=use_lockfile=true

      - name: Terraform Apply
        id: apply
        working-directory: ${{ github.workspace }}/aws/labs/${{ github.event.inputs.lab }}
        if: github.event.inputs.action == 'apply'
        continue-on-error: true
        run: |
          # Apply Terraform configuration
          terraform apply -auto-approve \
            -var='trainee_username=${{ github.event.inputs.student_username }}' \
            -var='aws_region=${{ vars.AWS_REGION }}'

      - name: Mask sensitive inputs
        run: echo "::add-mask::${{ github.event.inputs.student_password }}"

      - name: Set IAM user password
        id: set-password
        if: github.event.inputs.action == 'apply' && steps.apply.outcome == 'success'
        env:
          STUDENT_USERNAME: ${{ github.event.inputs.student_username }}
          STUDENT_PASSWORD: ${{ github.event.inputs.student_password }}
        run: |
          sleep 15 # Wait for IAM user to be fully available
          set -euo pipefail

          if aws iam get-login-profile --user-name "$STUDENT_USERNAME" >/dev/null 2>&1; then
            aws iam update-login-profile \
              --user-name "$STUDENT_USERNAME" \
              --password "$STUDENT_PASSWORD" \
              --no-password-reset-required
          else
            aws iam create-login-profile \
              --user-name "$STUDENT_USERNAME" \
              --password "$STUDENT_PASSWORD" \
              --no-password-reset-required
          fi

      - name: Set lab status output
        id: status
        run: |
          if [ "${{ github.event.inputs.action }}" == "apply" ] && [ "${{ steps.apply.outcome }}" == "success" ] && [ "${{ steps.set-password.outcome }}" == "success" ]; then
            echo "status=ready" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Resource Cleanup
        id: cleanup
        if: github.event.inputs.action == 'destroy'
        run: |
          python3 aws/scripts/cleanup_resources.py ${{ github.event.inputs.student_username }} ${{ vars.AWS_REGION }}

      - name: Terraform Destroy
        id: destroy
        if: github.event.inputs.action == 'destroy'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_wait_seconds: 15
          command: |
            # Go to the lab directory
            cd ${{ github.workspace }}/aws/labs/${{ github.event.inputs.lab }}
            # Destroy Terraform-managed infrastructure
            terraform destroy -auto-approve \
              -var='trainee_username=${{ github.event.inputs.student_username }}' \
              -var='aws_region=${{ vars.AWS_REGION }}'

  notify-backend:
    name: Notify backend when lab is ready
    needs: terraform
    if: github.event.inputs.action == 'apply'
    uses: cloudsteak/student-lab/.github/workflows/lab-ready-callback.yml@main
    with:
      student_username: ${{ github.event.inputs.student_username }}
      status: ${{ needs.terraform.outputs.status }}
    secrets:
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

  alert-manager:
    name: Alert Manager Notification
    needs: terraform
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Placeholder notification
        run: |
          # This is where the Slack alert will go.
          curl -X POST -H 'Content-type: application/json' \
          --data "{
              \"text\": \"🚨 AWS Lab Manager 🚨\\n   - Action: ${{ github.event.inputs.action }}\\n   - User: ${{ github.event.inputs.student_username }}\\n   - Status: ${{ needs.terraform.outputs.status }}\\n   - Run: $GITHUB_RUN_NUMBER\"
          }" \
          ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
