name: Notify Backend When Lab is Ready

on:
  workflow_call:
    inputs:
      student_username:
        required: true
        type: string
      status:
        required: false
        type: string
        default: "ready"
    secrets:
      BACKEND_API_KEY:
        required: true

jobs:
  notify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Notify backend when lab is ${{ inputs.status }}
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -euo pipefail
          HOST="https://${{ vars.BACKEND_HOST }}/lab-ready"
          BODY="{\"username\": \"${{ inputs.student_username }}\", \"status\": \"${{ inputs.status }}\"}"

          curl -sS -X POST "$HOST" \
            -H "X-API-Key: ${BACKEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
