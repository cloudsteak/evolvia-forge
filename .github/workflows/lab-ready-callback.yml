name: Notify Backend When Lab is Ready

on:
  workflow_call:
    inputs:
      student_username:
        required: true
        type: string
      status:
        required: false
        type: string
        default: "ready"
    secrets:
      BACKEND_API_KEY:
        required: false
      AUTH0_AUDIENCE:
        required: false
      AUTH0_CLIENT_ID:
        required: false
      AUTH0_CLIENT_SECRET:
        required: false

jobs:
  notify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Notify backend when lab is ${{ inputs.status }}
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          HOST="https://${{ vars.BACKEND_HOST }}/lab-ready"
          BODY="{\"username\": \"${{ inputs.student_username }}\", \"status\": \"${{ inputs.status }}\"}"

          if [[ -n "${BACKEND_API_KEY:-}" ]]; then
            curl -sS -X POST "$HOST" \
              -H "X-API-Key: ${BACKEND_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$BODY"
            exit 0
          fi

          response=$(curl -s --request POST \
            --url "https://${{ vars.AUTH0_DOMAIN }}/oauth/token" \
            --header 'Content-Type: application/json' \
            --data "{
                \"grant_type\": \"client_credentials\",
                \"audience\": \"${AUTH0_AUDIENCE}\",
                \"client_id\": \"${AUTH0_CLIENT_ID}\",
                \"client_secret\": \"${AUTH0_CLIENT_SECRET}\"
                }")

          token=$(echo "$response" | jq -r .access_token)
          if [[ "$token" == "null" || -z "$token" ]]; then
            echo "Failed to get token: $response"
            exit 1
          fi

          curl -sS -X POST "$HOST" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
